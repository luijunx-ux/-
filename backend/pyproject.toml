[project]
name = "tianrenlu-backend"
version = "0.1.0"
description = "天人律 AI 生命节律后端"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  "pwdlib[argon2]>=0.3,<1",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tzdata>=2025.2",
  "timezonefinder>=8.2,<9",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "asyncio: run an asynchronous test with pytest-asyncio",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
